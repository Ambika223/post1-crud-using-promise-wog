<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post CRUD using Fetch Promise Without Generic</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
        integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
    <link rel="stylesheet" href="./assets/css/style.css">
</head>

<body class="bg-light">
    <div class="spinner d-none" id="spinner">
        <div class="spinner-border text-primary" role="status">
            <span class="sr-only">Loading...</span>
        </div>
    </div>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <form id="postForm">
                    <div class="card">
                        <div class="card-header bg-primary text-white py-3">
                            <h4 class="text-center mb-0"> Post Information</h4>
                        </div>
                        <div class="card-body p-4">
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="form-group">
                                        <label for="title" class="font-weight-bold">Post Title</label>
                                        <input type="text" id="title" class="form-control"
                                            placeholder="Enter post title" required>
                                    </div>
                                </div>

                                <div class="col-md-6">
                                    <div class="form-group">
                                        <label for="author" class="font-weight-bold">Author</label>
                                        <input type="text" id="author" class="form-control"
                                            placeholder="Enter author name" required>
                                    </div>
                                </div>

                                <div class="col-12">
                                    <div class="form-group">
                                        <label for="description" class="font-weight-bold"> Post Description </label>
                                        <textarea id="description" class="form-control" rows="4" required></textarea>
                                    </div>
                                </div>

                                <div class="col-12">
                                    <div class="form-group mb-0">
                                        <label class="font-weight-bold d-block">
                                            Post Status
                                        </label>

                                        <div class="custom-control custom-checkbox">
                                            <input type="checkbox" class="custom-control-input" id="isPublished">
                                            <label class="custom-control-label" for="isPublished">Publish this post
                                            </label>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="card-footer bg-white p-3">
                            <button type="submit" class="btn btn-primary btn-block" id="addPostBtn">+ Add Post </button>
                            <button type="button" class="btn btn-success btn-block d-none" id="updatePostBtn">Update
                                Post </button>
                        </div>
                    </div>
                </form>

            </div>
        </div>

        <div class="row mt-4" id="postContainer">
            <div class="col-md-3 mb-4">
                <div class="card h-100">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h4 class="m-0">HTML</h4>
                        <span class="badge badge-success">Published</span>
                    </div>
                    <div class="card-body">
                        <p><strong>Author:</strong>John</p>
                        <p class="m-0">HyperText MarkUp Language</p>
                    </div>
                    <div class="card-footer d-flex justify-content-between">
                        <button type="button" class="btn btn-sm btn-primary">Edit</button>
                        <button type="button" class="btn btn-sm btn-danger">Remove</button>
                    </div>
                </div>
            </div>
        </div>
        <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
        <script src="./assets/js/app.js"></script>

</body>

</html>
